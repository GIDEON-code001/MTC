services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure OCI environment first}
      POSTGRES_USER: ${POSTGRES_USER:?configure OCI environment first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure OCI environment first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: src/BodaBoss.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:?configure OCI environment first};Username=${POSTGRES_USER:?configure OCI environment first};Password=${POSTGRES_PASSWORD:?configure OCI environment first}"
      Cors__AllowedOrigins__0: "https://${APP_DOMAIN:?configure OCI environment first}"
      Database__InitializeSchema: "false"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?configure OCI environment first}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:?configure OCI environment first}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:?configure OCI environment first}

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "https://${APP_DOMAIN:?configure OCI environment first}"
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 5000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - admin
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?configure OCI environment first}
      ACME_EMAIL: ${ACME_EMAIL:?configure OCI environment first}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
